<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backgammon — rule tests</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #2b2b2b;
      color: #eee;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.6;
    }
    h1 { font-size: 18px; }
    .pass { color: #7fc47f; }
    .fail { color: #e06c6c; }
    .msg { color: #e0a030; padding-left: 18px; }
    p { font-size: 16px; }
  </style>
</head>
<body>
  <h1>Backgammon — rule tests</h1>
  <div id="results">Running…</div>

  <script>
    /* Loaded this way rather than with plain <script src> tags because the
       page is opened over file://, where browsers cache aggressively and
       will happily re-run the previous version of rules.js after you have
       edited it - showing stale passes. The timestamp forces a fresh fetch
       every run. async = false keeps them executing in order. */
    ['rules.js', 'sync.js', 'tests.js'].forEach((src) => {
      const script = document.createElement('script');
      script.src = `${src}?v=${Date.now()}`;
      script.async = false;
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
