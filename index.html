<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backgammon</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <h1>Backgammon</h1>

  <button id="restart-button">Restart</button>

  <div class="dice-area">
    <div id="turn-indicator">White's turn</div>
    <label id="hints-toggle-label"><input type="checkbox" id="hints-toggle"> Hints</label>
    <div id="pip-count" hidden></div>
    <div class="online-area">
      <button id="play-online-button">Play Online</button>
      <div id="room-status" hidden>
        <span id="room-info"></span>
        <button id="copy-link-button">Copy link</button>
      </div>
    </div>
    <div class="dice" id="dice"></div>
    <button id="roll-button">Roll</button>
    <div id="message"></div>
    <div id="game-over"></div>
    <div id="rotate-hint">Rotate your device for a bigger board</div>
  </div>

  <div class="board">
    <div class="board-row top">
      <div class="quadrant">
        <div class="point point-down odd" data-point="13"></div>
        <div class="point point-down even" data-point="14"></div>
        <div class="point point-down odd" data-point="15"></div>
        <div class="point point-down even" data-point="16"></div>
        <div class="point point-down odd" data-point="17"></div>
        <div class="point point-down even" data-point="18"></div>
      </div>

      <div class="bar">
        <div class="bar-checkers"></div>
      </div>

      <div class="quadrant">
        <div class="point point-down odd" data-point="19"></div>
        <div class="point point-down even" data-point="20"></div>
        <div class="point point-down odd" data-point="21"></div>
        <div class="point point-down even" data-point="22"></div>
        <div class="point point-down odd" data-point="23"></div>
        <div class="point point-down even" data-point="24"></div>
      </div>

      <div class="off" data-owner="black">
        <div class="off-checkers"></div>
      </div>
    </div>

    <div class="board-row bottom">
      <div class="quadrant">
        <div class="point point-up even" data-point="12"></div>
        <div class="point point-up odd" data-point="11"></div>
        <div class="point point-up even" data-point="10"></div>
        <div class="point point-up odd" data-point="9"></div>
        <div class="point point-up even" data-point="8"></div>
        <div class="point point-up odd" data-point="7"></div>
      </div>

      <div class="bar">
        <div class="bar-checkers"></div>
      </div>

      <div class="quadrant">
        <div class="point point-up even" data-point="6"></div>
        <div class="point point-up odd" data-point="5"></div>
        <div class="point point-up even" data-point="4"></div>
        <div class="point point-up odd" data-point="3"></div>
        <div class="point point-up even" data-point="2"></div>
        <div class="point point-up odd" data-point="1"></div>
      </div>

      <div class="off" data-owner="white">
        <div class="off-checkers"></div>
      </div>
    </div>
  </div>

  <div id="celebration" hidden>
    <div id="confetti-layer"></div>
    <div id="celebration-content">
      <div id="celebration-message"></div>
      <button id="play-again-button">Play Again</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js?v=6"></script>
  <script src="rules.js?v=6"></script>
  <script src="sync.js?v=6"></script>
  <script src="script.js?v=6"></script>
</body>
</html>
