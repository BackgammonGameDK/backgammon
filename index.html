<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backgammon</title>
  <link rel="stylesheet" href="style.css?v=43">
</head>
<body>
  <h1>Backgammon</h1>

  <div class="dice-area">
    <div class="status-row">
      <div id="turn-indicator">White's turn</div>
      <label id="hints-toggle-label"><input type="checkbox" id="hints-toggle"> Hints</label>
      <div id="pip-count" hidden></div>
    </div>
    <div class="online-area">
      <div id="room-status" hidden>
        <button id="room-chip" hidden></button>
        <div id="room-details">
          <span id="room-info"></span>
          <button id="copy-link-button">Copy link</button>
          <button id="qr-toggle-button">QR</button>
          <div id="qr-panel" hidden>
            <div id="qr-code"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="dice" id="dice"></div>
    <!-- One row, not two: a new row in .dice-area would change the board's
         --chrome budget and silently shrink it. Undo is sized to match
         Roll's height so the row is exactly as tall as it was. -->
    <div class="turn-controls">
      <button id="roll-button">Roll</button>
      <button id="undo-button" disabled>Undo</button>
    </div>
    <div id="message"></div>
    <div id="game-over"></div>
    <div id="rotate-hint">Rotate your device for a bigger board</div>
    <!-- Both live in one wrapper so they position as a pair. Restart used
         to be the lone `position: fixed` element here; the wrapper now
         carries that, including the landscape case where it joins the
         sidebar's flow instead. -->
    <div class="corner-controls">
      <button id="exit-button">Exit</button>
      <button id="restart-button">Restart</button>
    </div>
  </div>

  <div class="board">
    <div class="board-row top">
      <div class="quadrant">
        <div class="point point-down odd" data-point="13"></div>
        <div class="point point-down even" data-point="14"></div>
        <div class="point point-down odd" data-point="15"></div>
        <div class="point point-down even" data-point="16"></div>
        <div class="point point-down odd" data-point="17"></div>
        <div class="point point-down even" data-point="18"></div>
      </div>

      <div class="bar" data-owner="white">
        <div class="bar-checkers"></div>
        <div class="bar-count" data-owner="white"></div>
      </div>

      <div class="quadrant">
        <div class="point point-down odd" data-point="19"></div>
        <div class="point point-down even" data-point="20"></div>
        <div class="point point-down odd" data-point="21"></div>
        <div class="point point-down even" data-point="22"></div>
        <div class="point point-down odd" data-point="23"></div>
        <div class="point point-down even" data-point="24"></div>
      </div>

      <div class="off" data-owner="black">
        <div class="off-checkers"></div>
        <div class="off-count" data-owner="black"></div>
      </div>
    </div>

    <div class="board-row bottom">
      <div class="quadrant">
        <div class="point point-up even" data-point="12"></div>
        <div class="point point-up odd" data-point="11"></div>
        <div class="point point-up even" data-point="10"></div>
        <div class="point point-up odd" data-point="9"></div>
        <div class="point point-up even" data-point="8"></div>
        <div class="point point-up odd" data-point="7"></div>
      </div>

      <div class="bar" data-owner="black">
        <div class="bar-checkers"></div>
        <div class="bar-count" data-owner="black"></div>
      </div>

      <div class="quadrant">
        <div class="point point-up even" data-point="6"></div>
        <div class="point point-up odd" data-point="5"></div>
        <div class="point point-up even" data-point="4"></div>
        <div class="point point-up odd" data-point="3"></div>
        <div class="point point-up even" data-point="2"></div>
        <div class="point point-up odd" data-point="1"></div>
      </div>

      <div class="off" data-owner="white">
        <div class="off-checkers"></div>
        <div class="off-count" data-owner="white"></div>
      </div>
    </div>
  </div>

  <!-- The entry point: which kind of game, chosen before a game exists.
       The online controls live here rather than beside Roll and Hints,
       where they read as one more in-game button instead of the choice
       they actually are. Visible by default and hidden by script.js when
       the URL already carries a #room= code - an invite link should open
       straight into the game, not stop to ask a question it has already
       answered. -->
  <div id="start-screen">
    <div id="start-content">
      <div id="start-title">Backgammon</div>
      <button id="start-hotseat-button" class="start-primary">Play on this device</button>
      <div id="start-divider"><span>or play online</span></div>
      <!-- Shown only when this browser has been in a room before. First
           among the online options because a returning player is exactly
           who needs it - a first-time visitor never sees it at all. -->
      <button id="rejoin-button" class="start-primary" hidden>Rejoin room <span id="rejoin-code"></span></button>
      <button id="play-online-button" class="start-primary">Start an online game</button>
      <div id="start-join-label">Got a room code from a friend?</div>
      <div id="join-area">
        <input id="room-code-input" type="text" maxlength="6" placeholder="Room code" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button id="join-room-button">Join</button>
      </div>
      <div id="start-error" hidden></div>
    </div>
  </div>

  <div id="celebration" hidden>
    <div id="confetti-layer"></div>
    <div id="celebration-content">
      <div id="celebration-message"></div>
      <button id="play-again-button">Play Again</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js?v=43"></script>
  <script src="qrcode-generator.js?v=43"></script>
  <script src="rules.js?v=43"></script>
  <script src="sync.js?v=43"></script>
  <script src="script.js?v=43"></script>
</body>
</html>
