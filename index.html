<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Backgammon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Backgammon</h1>

  <div class="board">
    <div class="board-row top">
      <div class="quadrant">
        <div class="point point-down odd" data-point="13">
          <div class="checker white"></div>
          <div class="checker white"></div>
          <div class="checker white"></div>
          <div class="checker white"></div>
          <div class="checker white"></div>
        </div>
        <div class="point point-down even" data-point="14"></div>
        <div class="point point-down odd" data-point="15"></div>
        <div class="point point-down even" data-point="16"></div>
        <div class="point point-down odd" data-point="17">
          <div class="checker black"></div>
          <div class="checker black"></div>
          <div class="checker black"></div>
        </div>
        <div class="point point-down even" data-point="18"></div>
      </div>

      <div class="bar">
        <div class="bar-checkers"></div>
      </div>

      <div class="quadrant">
        <div class="point point-down odd" data-point="19">
          <div class="checker black"></div>
          <div class="checker black"></div>
          <div class="checker black"></div>
          <div class="checker black"></div>
          <div class="checker black"></div>
        </div>
        <div class="point point-down even" data-point="20"></div>
        <div class="point point-down odd" data-point="21"></div>
        <div class="point point-down even" data-point="22"></div>
        <div class="point point-down odd" data-point="23"></div>
        <div class="point point-down even" data-point="24">
          <div class="checker white"></div>
          <div class="checker white"></div>
        </div>
      </div>
    </div>

    <div class="board-row bottom">
      <div class="quadrant">
        <div class="point point-up even" data-point="12">
          <div class="checker black"></div>
          <div class="checker black"></div>
          <div class="checker black"></div>
          <div class="checker black"></div>
          <div class="checker black"></div>
        </div>
        <div class="point point-up odd" data-point="11"></div>
        <div class="point point-up even" data-point="10"></div>
        <div class="point point-up odd" data-point="9"></div>
        <div class="point point-up even" data-point="8">
          <div class="checker white"></div>
          <div class="checker white"></div>
          <div class="checker white"></div>
        </div>
        <div class="point point-up odd" data-point="7"></div>
      </div>

      <div class="bar">
        <div class="bar-checkers"></div>
      </div>

      <div class="quadrant">
        <div class="point point-up even" data-point="6">
          <div class="checker white"></div>
          <div class="checker white"></div>
          <div class="checker white"></div>
          <div class="checker white"></div>
          <div class="checker white"></div>
        </div>
        <div class="point point-up odd" data-point="5"></div>
        <div class="point point-up even" data-point="4"></div>
        <div class="point point-up odd" data-point="3"></div>
        <div class="point point-up even" data-point="2"></div>
        <div class="point point-up odd" data-point="1">
          <div class="checker black"></div>
          <div class="checker black"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
